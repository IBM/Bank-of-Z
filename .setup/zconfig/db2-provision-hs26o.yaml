    catdstcl: ARCH0A
    catxdacl: DCDB2EXT
    catxstcl: ARCH0A
  db2_java_properties:
    javahome: "/usr/lpp/java/java21/current_64"
    claspath: "/usr/include/java_classes"
    libpath: "/usr/lib/java_runtime64"
    jccsid: IBMUSER
    jvmamode: 64
    javaenv: DB2A.DSN1WLMJ.JAVAENV
    javaenvv: "/u/ibmuser/db2aenvfile.txt"
    jvmprops: "/u/ibmuser/db2ajvmsp"
  db2_decp_parameters:
    asccsid: 1252
  db2_smpe_target_libraries:
    dsnexit: DB2V13.DB2A.SDSNEXIT
  other_libraries:
    cicsmod: CICSTS63.CICS.SDFHLOAD
    cicscob: CICSTS63.CICS.SDFHCOB
    cicspli: CICSTS63.CICS.SDFHPL1
    cicsexci: CICSTS63.CICS.SDFHEXCI