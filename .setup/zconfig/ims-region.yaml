            days: 40
            versions: 55
          ixvolser: "{{ vars.ims_ixvolser }}"
          access: UPDATE
          acbmgmt: CATALOG
        common_service_layer:
          cmdsec: false
          imsplex: "{{ vars.ims_plex }}"
          modblks: DYN
        dynamic_resources:
