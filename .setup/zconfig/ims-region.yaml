          oldsdef:
            mode: DUAL
            olds:
            - '00'
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '99'
            bufno: 5
          wadsdef:
            mode: SINGLE
            wads:
            - '0'
            - '1'
            - '8'
            - '9'
          arc: 3
