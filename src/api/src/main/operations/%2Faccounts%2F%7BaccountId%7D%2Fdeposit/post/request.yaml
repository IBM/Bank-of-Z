---
version: "1.2"
mappings:
- commarea:
    mappings:
    - PAYDBCRZ:
        required: false
        nullable: false
        mappings:
        - COMM-ACCNO:
            required: false
            nullable: false
            expression: "$pad($replace($string($pathParameters.accountId), /\\D/, ''), -8, '0')"
        - COMM-AMT:
            required: false
            nullable: false
            expression: "$body.amount"
        - COMM-SORTC:
            required: false
            nullable: false
            expression: "$exists($body.sortCode) ? $number($body.sortCode) : 987654"
        - COMM-AV-BAL:
            required: false
            nullable: false
            expression: 0
        - COMM-ACT-BAL:
            required: false
            nullable: false
            expression: 0
        - COMM-ORIGIN:
            required: false
            nullable: false
            mappings:
            - COMM-APPLID:
                required: false
                nullable: false
                template: ""
            - COMM-USERID:
                required: false
                nullable: false
                template: ""
            - COMM-FACILITY-NAME:
                required: false
                nullable: false
                template: ""
            - COMM-NETWRK-ID:
                required: false
                nullable: false
                template: ""
            - COMM-FACILTYPE:
                required: false
                nullable: false
                expression: 496
            - COMM-DESCRIPTION:
                required: false
                nullable: false
                expression: "$body.description ? $body.description : ''"
        - COMM-SUCCESS:
            required: false
            nullable: false
            template: "N"
        - COMM-FAIL-CODE:
            required: false
            nullable: false
            template: " "
