---
version: "1.0"
response_200.yaml:
  condition: "$zosAssetResponse.commarea.UPDACCZ.\"COMM-SUCCESS\" = 'Y'"
  httpStatusCode: 200
response_400.yaml:
  condition: "$zosAssetResponse.commarea.UPDACCZ.\"COMM-SUCCESS\" = 'N'"
  httpStatusCode: 400
response_404.yaml:
  condition: "$exists($zosAssetResponse.commarea.UPDACCZ) and $zosAssetResponse.commarea.UPDACCZ.\"COMM-SUCCESS\" != 'Y'"
  httpStatusCode: 404
response_500.yaml:
  condition: true
  httpStatusCode: 500
