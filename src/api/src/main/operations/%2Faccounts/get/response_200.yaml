---
version: "1.2"
mappings:
- body:
    mappings:
    - accounts:
        required: true
        nullable: false
        foreach:
          input: "$zosAssetResponse.commarea.INQACCS.\"ACCOUNT-DETAILS\""
          mappings:
          - accountId:
              required: true
              nullable: false
              template: "{{$item.\"COMM-ACCNO\"}}"
          - accountType:
              required: true
              nullable: false
              template: "{{$item.\"COMM-ACC-TYPE\"}}"
          - currency:
              required: true
              nullable: false
              template: "GBP"
          - accountNumber:
              required: false
              nullable: false
              template: "{{$item.\"COMM-ACCNO\"}}"
          - sortCode:
              required: false
              nullable: false
              template: "{{$item.\"COMM-SCODE\"}}"
          - status:
              required: true
              nullable: false
              template: "ACTIVE"
          - customerId:
              required: false
              nullable: false
              template: "{{$item.\"COMM-CUSTNO\"}}"
          - openingDate:
              required: false
              nullable: false
              template: "{{$item.\"COMM-OPENED-GROUP\".\"COMM-OPENED-YEAR\"}}-{{$item.\"COMM-OPENED-GROUP\".\"COMM-OPENED-MONTH\"}}-{{$item.\"COMM-OPENED-GROUP\".\"COMM-OPENED-DAY\"}}"
          - interestRate:
              required: false
              nullable: true
              expression: "$item.\"COMM-INT-RATE\""
          - overdraftLimit:
              required: false
              nullable: true
              expression: "$item.\"COMM-OVERDRAFT\""
          - availableBalance:
              required: false
              nullable: true
              expression: "$item.\"COMM-AVAIL-BAL\""
          - actualBalance:
              required: false
              nullable: true
              expression: "$item.\"COMM-ACTUAL-BAL\""
    - totalCount:
        required: false
        nullable: false
        expression: "$count($zosAssetResponse.commarea.INQACCS.\"ACCOUNT-DETAILS\")"
