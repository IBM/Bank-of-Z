plugins {
    id 'java'
}

group = 'com.ibm.ims'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Allow the output directory to be overridden via -PoutputDir=<path>
def outputDir = project.findProperty('outputDir') ?: layout.buildDirectory.get().asFile.absolutePath

jar {
    archiveBaseName = 'nazare-ims-jmp'
    destinationDirectory = file(outputDir)
}

dependencies {
     implementation files(
        '/usr/lpp/ims/ims15/imsjava/imsudb.jar',
        '/usr/lpp/java/J8.0_64/lib/ext/ibmjzos.jar',
        '/usr/lpp/IBM/zosconnect/v3r0/runtime/lib/jaxb-api-2.2.12.jar',
        '/usr/lpp/IBM/aln/v3r2/core/iml-library/library/db2jcc/db2jcc4.jar'
    )
}

