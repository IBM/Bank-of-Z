plugins {
    id 'java'
}

group = 'com.ibm.boz'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Allow the output directory to be overridden via -PoutputDir=<path>
def outputDir = project.findProperty('outputDir') ?: layout.buildDirectory.get().asFile.absolutePath

jar {
    archiveBaseName = 'boz-mq'
    destinationDirectory = file(outputDir)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.ibm.mq:com.ibm.mq.jakarta.client:10.0.0.0'
    implementation 'jakarta.jms:jakarta.jms-api:3.1.0'
}
