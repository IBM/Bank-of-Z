<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open account - Bank of Z</title>
    <link rel="stylesheet" href="css/carbon-styles.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/carbon-overrides.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="page">
        <section class="page-banner"><div class="page-inner" id="banner"></div></section>

        <section class="page-content">
            <div class="page-inner">
                <div id="notification-container"></div>
                <div id="content"></div>
            </div>
        </section>
    </main>

    <script type="module" src="js/carbon.js"></script>
    <script type="module">
        import api from './js/api.js';
        import { mountPage, notify, clearNotification, errorMessage } from './js/components/layout.js';
        import {
            readContext, customerLookupHtml, bindCustomerLookup, urls, pageUrl, IMS_LIMITED_NOTE
        } from './js/components/lookup.js';
        import { showLoadingModal, hideLoadingModal, escapeHtml } from './js/utils.js';

        const content = document.getElementById('content');
        const { customer } = readContext();

        if (!customer) {
            showLookup();
        } else if (!customer.ok) {
            showLookup();
            notify('error', 'Invalid customer ID', customer.error);
        } else {
            showForm(customer);
        }

        /* ---------- step 1: which customer? ---------- */
        function showLookup() {
            mountPage({ crumbs: [{ label: 'Home', href: 'admin.html' }, { label: 'Open account' }], title: 'Open an account' });
            content.innerHTML = `
                <div class="card" style="max-width: 640px;">
                    <h2 class="card__title">Which customer is this for?</h2>
                    <p class="card__intro">Accounts always belong to a customer. Enter their customer ID to continue.</p>
                    ${customerLookupHtml({ buttonLabel: 'Continue' })}
                </div>`;
            bindCustomerLookup({ onFound: (r) => { window.location.href = urls.createAccount(r.ref); } });
        }

        /* ---------- step 2: account terms ---------- */
        function showForm(ref) {
            mountPage({
                crumbs: [{ label: 'Home', href: 'admin.html' }, { label: ref.ref, href: urls.customer(ref.ref) }, { label: 'Open account' }],
                title: 'Open an account',
                subtitle: `For customer ${ref.ref}`
            });

            if (ref.system === 'IMS') {
                content.innerHTML = `
                    <cds-inline-notification kind="error" title="Not implemented for IMS"
                        subtitle="${escapeHtml('Opening accounts is not implemented for IMS (I) customers. ' + IMS_LIMITED_NOTE)}"
                        hide-close-button style="max-width:none;width:100%"></cds-inline-notification>
                    <div><cds-button kind="secondary" href="${urls.customer(ref.ref)}">Back to customer</cds-button></div>`;
                return;
            }

            content.innerHTML = `
                <div class="card">
                    <div class="card__header"><h2 class="card__title">Account terms</h2></div>
                    <div class="form-grid">
                        <cds-select id="accountType" label-text="Account type">
                            <cds-select-item value="">Select...</cds-select-item>
                            <cds-select-item value="CURRENT">Current</cds-select-item>
                            <cds-select-item value="SAVING">Savings</cds-select-item>
                            <cds-select-item value="ISA">ISA</cds-select-item>
                            <cds-select-item value="LOAN">Loan</cds-select-item>
                            <cds-select-item value="MORTGAGE">Mortgage</cds-select-item>
                        </cds-select>
                        <cds-number-input id="interestRate" label="Interest rate (%)" value="0" min="0" max="99.99" step="0.01"></cds-number-input>
                        <cds-number-input id="overdraft" label="Overdraft limit" value="0" min="0" step="100"></cds-number-input>
                        <cds-number-input id="initialBalance" label="Initial balance / amount owed" value="0" step="100"
                            helper-text="For a loan or mortgage, enter the amount owed"></cds-number-input>
                    </div>
                    <div class="form-actions">
                        <cds-button id="submit-btn">Open account</cds-button>
                        <cds-button kind="secondary" href="${urls.customer(ref.ref)}">Cancel</cds-button>
                    </div>
                </div>`;

            document.getElementById('submit-btn').addEventListener('click', () => createAccount(ref));
        }

        async function createAccount(ref) {
            clearNotification();
            const accountType = document.getElementById('accountType').value;
            const interestRate = parseFloat(document.getElementById('interestRate').value) || 0;
            const overdraftLimit = parseInt(document.getElementById('overdraft').value, 10) || 0;
            const initialBalance = parseFloat(document.getElementById('initialBalance').value) || 0;

            if (!accountType) return notify('error', 'Validation error', 'Choose an account type');
            if (interestRate < 0 || interestRate > 99.99) return notify('error', 'Validation error', 'Interest rate must be between 0 and 99.99');
            if (overdraftLimit < 0) return notify('error', 'Validation error', 'Overdraft limit must be zero or more');

            showLoadingModal('Opening account...');
            try {
                const response = await api.accounts.createAccount({
                    customerNumber: ref.id,
                    accountType,
                    interestRate,
                    overdraftLimit,
                    initialBalance,
                    openedDate: new Date().toISOString().split('T')[0]
                }, ref.system);
                hideLoadingModal();
                window.location.href = pageUrl('account-details.html', {
                    accountId: response.accountId,
                    customerId: ref.ref,
                    created: '1'
                });
            } catch (error) {
                hideLoadingModal();
                notify('error', 'Could not open account', errorMessage(error, 'Failed to create account. Check the customer exists.'));
            }
        }
    </script>
</body>
</html>
