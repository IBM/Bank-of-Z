<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit / debit - Bank of Z</title>
    <link rel="stylesheet" href="css/carbon-styles.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/carbon-overrides.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="page">
        <section class="page-banner"><div class="page-inner" id="banner"></div></section>

        <section class="page-content">
            <div class="page-inner">
                <div id="notification-container"></div>
                <div id="content"></div>
            </div>
        </section>
    </main>

    <script type="module" src="js/carbon.js"></script>
    <script type="module">
        import api from './js/api.js';
        import { mountPage, notify, clearNotification, errorMessage } from './js/components/layout.js';
        import {
            readContext, customerLookupHtml, bindCustomerLookup, fetchCustomerAccounts,
            loadAccountContext, urls, systemTagHtml
        } from './js/components/lookup.js';
        import { showLoadingModal, hideLoadingModal, formatCurrency, escapeHtml } from './js/utils.js';

        const content = document.getElementById('content');
        const { accountId, customer } = readContext();

        let account = null;
        let system = 'CICS';
        let customerRef = null;
        let customerNumber = null;

        if (customer && !customer.ok) {
            showLookup();
            notify('error', 'Invalid customer ID', customer.error);
        } else if (accountId) {
            loadAccount();
        } else if (customer) {
            loadAccountPicker(customer);
        } else {
            showLookup();
        }

        /* ---------- no customer: ask for one ---------- */
        function showLookup() {
            mountPage({ crumbs: [{ label: 'Home', href: 'admin.html' }, { label: 'Credit / debit' }], title: 'Credit or debit an account' });
            content.innerHTML = `
                <div class="card" style="max-width: 640px;">
                    <h2 class="card__title">Which customer?</h2>
                    <p class="card__intro">Enter the customer ID, then choose one of their accounts.</p>
                    ${customerLookupHtml({ buttonLabel: 'Continue' })}
                </div>`;
            bindCustomerLookup({ onFound: (r) => { window.location.href = urls.deposit(null, r.ref); } });
        }

        /* ---------- customer only: pick an account ---------- */
        async function loadAccountPicker(ref) {
            mountPage({
                crumbs: [{ label: 'Home', href: 'admin.html' }, { label: ref.ref, href: urls.customer(ref.ref) }, { label: 'Credit / debit' }],
                title: 'Credit or debit an account',
                subtitle: `Choose an account for customer ${ref.ref}`
            });
            content.innerHTML = '<cds-loading></cds-loading>';
            try {
                const accounts = await fetchCustomerAccounts(ref);
                if (!accounts.length) {
                    content.innerHTML = `<div class="card"><div class="empty">This customer has no accounts.</div></div>`;
                    return;
                }
                const rows = accounts.map((a) => `
                    <tr>
                        <td>${escapeHtml(a.accountNumber || a.accountId)}</td>
                        <td>${escapeHtml(a.accountType || 'N/A')}</td>
                        <td class="num">${formatCurrency(a.availableBalance, a.currency)}</td>
                        <td><a href="${urls.deposit(a.accountId, ref.ref)}">Select</a></td>
                    </tr>`).join('');
                content.innerHTML = `
                    <div class="card"><div class="table-wrap"><table class="bz-table">
                        <thead><tr><th>Account number</th><th>Type</th><th class="num">Available</th><th></th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table></div></div>`;
            } catch (error) {
                content.innerHTML = '';
                notify('error', 'Could not load accounts', errorMessage(error, 'Customer not found or error loading accounts'));
            }
        }

        /* ---------- account chosen: the form ---------- */
        async function loadAccount() {
            mountPage({ crumbs: [{ label: 'Home', href: 'admin.html' }, { label: 'Credit / debit' }], title: 'Credit or debit an account' });
            content.innerHTML = '<cds-loading></cds-loading>';
            try {
                const ctx = await loadAccountContext(accountId, customer);
                account = ctx.account;
                system = ctx.system;
                customerRef = ctx.ref;
                customerNumber = ctx.customerNumber;
            } catch (error) {
                content.innerHTML = '';
                notify('error', 'Account not found', errorMessage(error, `Could not load account ${accountId}`));
                return;
            }

            const number = account.accountNumber || account.accountId;
            mountPage({
                crumbs: [
                    { label: 'Home', href: 'admin.html' },
                    ...(customerRef ? [{ label: customerRef, href: urls.customer(customerRef) }] : []),
                    { label: `Account ${number}`, href: urls.account(account.accountId, customerRef) },
                    { label: 'Credit / debit' }
                ],
                title: 'Credit or debit',
                subtitle: `Account ${number}${customerRef ? ` for customer ${customerRef}` : ''}`
            });
            renderForm();
        }

        function renderForm() {
            const a = account;
            content.innerHTML = `
                <div class="stat-row">
                    <div class="stat"><div class="stat__label">Account</div><div class="stat__value">${escapeHtml(a.accountNumber || a.accountId)}</div></div>
                    <div class="stat"><div class="stat__label">Type</div><div class="stat__value">${escapeHtml(a.accountType || 'N/A')}</div></div>
                    <div class="stat"><div class="stat__label">Available balance</div><div class="stat__value" id="balance">${formatCurrency(a.availableBalance, a.currency)}</div></div>
                </div>
                <div class="card">
                    <div class="card__header"><h2 class="card__title">Transaction</h2>${systemTagHtml(system)}</div>
                    <div class="form-grid">
                        <cds-select id="sign" label-text="Type">
                            <cds-select-item value="credit">Credit: add funds</cds-select-item>
                            <cds-select-item value="debit">Debit: remove funds</cds-select-item>
                        </cds-select>
                        <cds-text-input id="amount" label="Amount" placeholder="e.g. 100.00" helper-text="Must be greater than 0"></cds-text-input>
                        <cds-text-input id="description" label="Description (optional)" maxlength="40" placeholder="Shown on the statement"></cds-text-input>
                    </div>
                    <div class="form-actions">
                        <cds-button id="submit-btn">Submit</cds-button>
                        <cds-button kind="secondary" href="${urls.account(a.accountId, customerRef)}">Back to account</cds-button>
                    </div>
                </div>`;
            document.getElementById('submit-btn').addEventListener('click', submit);
        }

        function pickBalance(result) {
            if (typeof result.availableBalance === 'number') return result.availableBalance;
            if (Array.isArray(result.availableBalance) && result.availableBalance.length) {
                const ids = result.accountId ? String(result.accountId).replace(/[\[\]]/g, '').split(',').map((s) => s.trim()) : [];
                const index = ids.indexOf(String(account.accountId));
                return result.availableBalance[index >= 0 ? index : 0];
            }
            return undefined;
        }

        async function submit() {
            clearNotification();
            const amount = parseFloat(document.getElementById('amount').value);
            const sign = document.getElementById('sign').value;
            const description = (document.getElementById('description').value || '').trim();

            if (!amount || amount <= 0) return notify('error', 'Validation error', 'Enter an amount greater than 0');

            const isDebit = sign === 'debit';
            showLoadingModal(isDebit ? 'Processing debit...' : 'Processing credit...');
            try {
                const result = await api.accounts.depositToAccount(account.accountId, {
                    amount: isDebit ? -amount : amount,
                    description: description || (isDebit ? 'Debit via web interface' : 'Credit via web interface')
                }, system, customerNumber);
                hideLoadingModal();

                const balance = pickBalance(result);
                if (balance !== undefined) {
                    account.availableBalance = balance;
                    document.getElementById('balance').textContent = formatCurrency(balance, account.currency);
                }
                document.getElementById('amount').value = '';
                document.getElementById('description').value = '';
                notify('success', isDebit ? 'Debit successful' : 'Credit successful',
                    `${formatCurrency(amount, account.currency)} ${isDebit ? 'debited from' : 'credited to'} account ${account.accountNumber || account.accountId}.` +
                    (balance !== undefined ? ` New available balance: ${formatCurrency(balance, account.currency)}.` : ''));
            } catch (error) {
                hideLoadingModal();
                notify('error', isDebit ? 'Debit failed' : 'Credit failed', errorMessage(error, 'The transaction could not be processed'));
            }
        }
    </script>
</body>
</html>
