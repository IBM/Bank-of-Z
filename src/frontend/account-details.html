<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Bank of Z</title>
    <link rel="stylesheet" href="css/carbon-styles.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/carbon-overrides.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="page">
        <section class="page-banner"><div class="page-inner" id="banner"></div></section>

        <section class="page-content">
            <div class="page-inner">
                <div id="notification-container"></div>
                <div id="content"></div>
            </div>
        </section>
    </main>

    <script type="module" src="js/carbon.js"></script>
    <script type="module">
        import api from './js/api.js';
        import { mountPage, setBanner, notify, clearNotification, errorMessage } from './js/components/layout.js';
        import {
            readContext, loadAccountContext, urls, pageUrl, systemTagHtml, IMS_LIMITED_NOTE
        } from './js/components/lookup.js';
        import { showLoadingModal, hideLoadingModal, showConfirmModal, formatCurrency, formatDate, escapeHtml } from './js/utils.js';

        const ACCOUNT_TYPES = ['SAVING', 'CURRENT', 'LOAN', 'MORTGAGE', 'ISA'];
        const content = document.getElementById('content');

        let account = null;
        let system = 'CICS';
        let customerRef = null;   // e.g. C0000000042, when known

        const { accountId, customer } = readContext();

        if (!accountId) {
            showLookup();
        } else if (customer && !customer.ok) {
            notify('error', 'Invalid customer ID', customer.error);
            showLookup();
        } else {
            load();
        }

        /* ---------- no account chosen yet ---------- */
        function showLookup() {
            mountPage({ crumbs: [{ label: 'Home', href: 'admin.html' }, { label: 'Find account' }], title: 'Find an account' });
            content.innerHTML = `
                <div class="card" style="max-width: 640px;">
                    <h2 class="card__title">Account number</h2>
                    <p class="card__intro">
                        Enter an account number to open it directly. To browse an IMS customer's accounts,
                        <a href="admin.html#find-customer">find the customer</a> first.
                    </p>
                    <div class="lookup">
                        <cds-text-input id="lookup-account" label="Account number" placeholder="e.g. 00000042"></cds-text-input>
                        <cds-button id="lookup-btn">Find account</cds-button>
                    </div>
                </div>`;
            const input = document.getElementById('lookup-account');
            const go = () => {
                const id = (input.value || '').trim();
                if (!/^\d+$/.test(id)) {
                    input.setAttribute('invalid', '');
                    input.setAttribute('invalid-text', 'Enter the account number (digits only)');
                    return;
                }
                window.location.href = pageUrl('account-details.html', { accountId: id });
            };
            document.getElementById('lookup-btn').addEventListener('click', go);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
        }

        /* ---------- load ---------- */
        async function load() {
            mountPage({
                crumbs: [{ label: 'Home', href: 'admin.html' }, ...(customer ? [{ label: customer.ref, href: urls.customer(customer.ref) }] : []), { label: `Account ${accountId}` }],
                title: `Account ${accountId}`
            });
            content.innerHTML = '<cds-loading></cds-loading>';
            try {
                const ctx = await loadAccountContext(accountId, customer);
                account = ctx.account;
                system = ctx.system;
                customerRef = ctx.ref;
            } catch (error) {
                content.innerHTML = '';
                notify('error', 'Account not found', errorMessage(error, `Could not load account ${accountId}`));
                content.innerHTML = '<div class="card"><p><a href="admin.html">Back to home</a> to look up another account.</p></div>';
                return;
            }
            render();
            if (new URLSearchParams(window.location.search).get('created')) {
                notify('success', 'Account opened', `Account ${account.accountNumber || account.accountId} has been created.`);
            }
        }

        function renderBanner() {
            const isIms = system === 'IMS';
            const id = account.accountId;
            const actions = [
                `<cds-button href="${urls.deposit(id, customerRef)}">Credit / debit</cds-button>`,
                isIms ? '' : `<cds-button kind="tertiary" href="${urls.transfer(id, customerRef)}">Transfer from this account</cds-button>`,
                isIms ? '' : `<cds-button kind="tertiary" href="${urls.transactions(id, customerRef)}">View transactions</cds-button>`,
                isIms ? '' : `<cds-button id="delete-account-btn" kind="danger-tertiary">Close account</cds-button>`
            ].join('');
            setBanner({
                crumbs: [
                    { label: 'Home', href: 'admin.html' },
                    ...(customerRef ? [{ label: customerRef, href: urls.customer(customerRef) }] : []),
                    { label: `Account ${account.accountNumber || id}` }
                ],
                title: `${account.accountType || 'Account'} account ${account.accountNumber || id}`,
                subtitle: customerRef ? `Customer ${customerRef}` : '',
                actionsHtml: actions
            });
            document.getElementById('delete-account-btn')?.addEventListener('click', deleteAccount);
        }

        function render() {
            renderBanner();
            clearNotification();
            const isIms = system === 'IMS';
            const a = account;

            content.innerHTML = `
                ${isIms ? `<cds-inline-notification kind="info" title="IMS account" subtitle="${escapeHtml(IMS_LIMITED_NOTE)}" hide-close-button style="max-width:none;width:100%"></cds-inline-notification>` : ''}
                <div class="stat-row">
                    <div class="stat"><div class="stat__label">Available balance</div><div class="stat__value">${formatCurrency(a.availableBalance, a.currency)}</div></div>
                    <div class="stat"><div class="stat__label">Actual balance</div><div class="stat__value">${formatCurrency(a.actualBalance, a.currency)}</div></div>
                    <div class="stat"><div class="stat__label">Status</div><div class="stat__value">${escapeHtml(a.status || 'N/A')}</div></div>
                </div>

                <div class="card">
                    <div class="card__header"><h2 class="card__title">Account details</h2>${systemTagHtml(system)}</div>
                    <dl class="kv">
                        <div><dt>Account number</dt><dd>${escapeHtml(a.accountNumber || a.accountId)}</dd></div>
                        <div><dt>Customer</dt><dd>${customerRef ? `<a href="${urls.customer(customerRef)}">${escapeHtml(customerRef)}</a>` : 'N/A'}</dd></div>
                        <div><dt>Currency</dt><dd>${escapeHtml(a.currency || 'N/A')}</dd></div>
                        <div><dt>Opened</dt><dd>${escapeHtml(a.openingDate ? formatDate(a.openingDate) : 'N/A')}</dd></div>
                        ${a.iban ? `<div><dt>IBAN</dt><dd>${escapeHtml(a.iban)}</dd></div>` : ''}
                    </dl>
                </div>

                <div class="card">
                    <div class="card__header"><h2 class="card__title">Terms</h2></div>
                    ${isIms ? termsReadOnly() : termsForm()}
                </div>`;

            if (!isIms) {
                document.getElementById('f-accountType').value = ACCOUNT_TYPES.includes(a.accountType) ? a.accountType : '';
                document.getElementById('save-btn').addEventListener('click', saveAccount);
                document.getElementById('reset-btn').addEventListener('click', render);
            }
        }

        function termsReadOnly() {
            const a = account;
            return `<dl class="kv">
                <div><dt>Account type</dt><dd>${escapeHtml(a.accountType || 'N/A')}</dd></div>
            </dl>`;
        }

        function termsForm() {
            const a = account;
            return `
                <div class="form-grid">
                    <cds-select id="f-accountType" label-text="Account type">
                        ${ACCOUNT_TYPES.map((t) => `<cds-select-item value="${t}">${t}</cds-select-item>`).join('')}
                    </cds-select>
                    <cds-text-input id="f-interestRate" label="Interest rate (%)" type="number"
                        value="${a.interestRate ?? ''}" helper-text="0 to 99.99"></cds-text-input>
                    <cds-text-input id="f-overdraftLimit" label="Overdraft limit" type="number"
                        value="${a.overdraftLimit ?? ''}" helper-text="Whole currency units"></cds-text-input>
                </div>
                <div class="form-actions">
                    <cds-button id="save-btn">Save changes</cds-button>
                    <cds-button id="reset-btn" kind="secondary">Discard changes</cds-button>
                </div>`;
        }

        /* ---------- update ---------- */
        async function saveAccount() {
            clearNotification();
            const type = document.getElementById('f-accountType').value;
            const rate = document.getElementById('f-interestRate').value;
            const overdraft = document.getElementById('f-overdraftLimit').value;

            const update = {};
            if (type) update.accountType = type;
            if (rate !== '') {
                const n = parseFloat(rate);
                if (Number.isNaN(n) || n < 0 || n > 99.99) return notify('error', 'Validation error', 'Interest rate must be between 0 and 99.99');
                update.interestRate = n;
            }
            if (overdraft !== '') {
                const n = parseInt(overdraft, 10);
                if (Number.isNaN(n) || n < 0) return notify('error', 'Validation error', 'Overdraft limit must be zero or more');
                update.overdraftLimit = n;
            }

            showLoadingModal('Saving account...');
            try {
                const updated = await api.accounts.updateAccount(account.accountId, update, system);
                hideLoadingModal();
                account = { ...account, ...updated, accountId: account.accountId };
                render();
                notify('success', 'Saved', 'Account updated');
            } catch (error) {
                hideLoadingModal();
                notify('error', 'Could not save account', errorMessage(error, 'Failed to update account'));
            }
        }

        /* ---------- close ---------- */
        async function deleteAccount() {
            const confirmed = await showConfirmModal(
                `Close account ${account.accountNumber || account.accountId}?`,
                'The account will be permanently deleted. This cannot be undone.',
                { confirmLabel: 'Close account', danger: true }
            );
            if (!confirmed) return;

            showLoadingModal('Closing account...');
            try {
                await api.accounts.deleteAccount(account.accountId, system);
                hideLoadingModal();
                const deleted = account.accountNumber || account.accountId;
                window.location.href = customerRef
                    ? pageUrl('customer-details.html', { customerId: customerRef, deletedAccount: deleted })
                    : pageUrl('admin.html', { deletedAccount: deleted });
            } catch (error) {
                hideLoadingModal();
                notify('error', 'Could not close account', errorMessage(error, 'Failed to delete account'));
            }
        }
    </script>
</body>
</html>
