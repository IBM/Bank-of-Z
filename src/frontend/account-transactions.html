<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Bank of Z</title>
    <link rel="stylesheet" href="css/carbon-styles.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/carbon-overrides.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="page">
        <section class="page-banner"><div class="page-inner" id="banner"></div></section>

        <section class="page-content">
            <div class="page-inner">
                <div id="notification-container"></div>
                <div id="content"></div>
            </div>
        </section>
    </main>

    <script type="module" src="js/carbon.js"></script>
    <script type="module">
        import api from './js/api.js';
        import { mountPage, notify, clearNotification, errorMessage } from './js/components/layout.js';
        import {
            readContext, customerLookupHtml, bindCustomerLookup, fetchCustomerAccounts,
            loadAccountContext, urls, IMS_LIMITED_NOTE, datePickerHtml, readDatePicker
        } from './js/components/lookup.js';
        import { formatCurrency, formatDate, escapeHtml } from './js/utils.js';

        const PAGE_SIZE = 25;
        const content = document.getElementById('content');
        const { accountId, customer } = readContext();

        let account = null;
        let customerRef = null;
        let offset = 0;
        let total = 0;
        let filters = {};

        if (customer && !customer.ok) {
            showLookup();
            notify('error', 'Invalid customer ID', customer.error);
        } else if (accountId) {
            loadAccount();
        } else if (customer) {
            loadAccountPicker(customer);
        } else {
            showLookup();
        }

        function showLookup() {
            mountPage({ crumbs: [{ label: 'Home', href: 'admin.html' }, { label: 'Transactions' }], title: 'Account transactions' });
            content.innerHTML = `
                <div class="card" style="max-width: 640px;">
                    <h2 class="card__title">Which customer?</h2>
                    <p class="card__intro">Enter the customer ID, then choose one of their accounts.</p>
                    ${customerLookupHtml({ buttonLabel: 'Continue' })}
                </div>`;
            bindCustomerLookup({ onFound: (r) => { window.location.href = urls.transactions(null, r.ref); } });
        }

        async function loadAccountPicker(ref) {
            mountPage({
                crumbs: [{ label: 'Home', href: 'admin.html' }, { label: ref.ref, href: urls.customer(ref.ref) }, { label: 'Transactions' }],
                title: 'Account transactions',
                subtitle: `Choose an account for customer ${ref.ref}`
            });
            if (ref.system === 'IMS') {
                content.innerHTML = `<cds-inline-notification kind="error" title="Not implemented for IMS" subtitle="${escapeHtml('Viewing transactions is not implemented for IMS (I) customers. ' + IMS_LIMITED_NOTE)}" hide-close-button style="max-width:none;width:100%"></cds-inline-notification>`;
                return;
            }
            content.innerHTML = '<cds-loading></cds-loading>';
            try {
                const accounts = await fetchCustomerAccounts(ref);
                if (!accounts.length) {
                    content.innerHTML = '<div class="card"><div class="empty">This customer has no accounts.</div></div>';
                    return;
                }
                const rows = accounts.map((a) => `
                    <tr>
                        <td>${escapeHtml(a.accountNumber || a.accountId)}</td>
                        <td>${escapeHtml(a.accountType || 'N/A')}</td>
                        <td class="num">${formatCurrency(a.availableBalance, a.currency)}</td>
                        <td><a href="${urls.transactions(a.accountId, ref.ref)}">View transactions</a></td>
                    </tr>`).join('');
                content.innerHTML = `<div class="card"><div class="table-wrap"><table class="bz-table">
                    <thead><tr><th>Account number</th><th>Type</th><th class="num">Available</th><th></th></tr></thead>
                    <tbody>${rows}</tbody></table></div></div>`;
            } catch (error) {
                content.innerHTML = '';
                notify('error', 'Could not load accounts', errorMessage(error, 'Customer not found or error loading accounts'));
            }
        }

        async function loadAccount() {
            mountPage({ crumbs: [{ label: 'Home', href: 'admin.html' }, { label: 'Transactions' }], title: 'Account transactions' });
            content.innerHTML = '<cds-loading></cds-loading>';

            if (customer && customer.system === 'IMS') {
                content.innerHTML = '';
                notify('error', 'Not implemented for IMS', 'Viewing transactions is not implemented for IMS (I) customers.');
                return;
            }
            try {
                const ctx = await loadAccountContext(accountId, customer);
                account = ctx.account;
                customerRef = ctx.ref;
            } catch (error) {
                content.innerHTML = '';
                notify('error', 'Account not found', errorMessage(error, `Could not load account ${accountId}`));
                return;
            }

            const number = account.accountNumber || account.accountId;
            mountPage({
                crumbs: [
                    { label: 'Home', href: 'admin.html' },
                    ...(customerRef ? [{ label: customerRef, href: urls.customer(customerRef) }] : []),
                    { label: `Account ${number}`, href: urls.account(account.accountId, customerRef) },
                    { label: 'Transactions' }
                ],
                title: 'Transactions',
                subtitle: `Account ${number}${customerRef ? ` for customer ${customerRef}` : ''}`
            });

            content.innerHTML = `
                <div class="stat-row">
                    <div class="stat"><div class="stat__label">Account</div><div class="stat__value">${escapeHtml(number)}</div></div>
                    <div class="stat"><div class="stat__label">Type</div><div class="stat__value">${escapeHtml(account.accountType || 'N/A')}</div></div>
                    <div class="stat"><div class="stat__label">Available balance</div><div class="stat__value">${formatCurrency(account.availableBalance, account.currency)}</div></div>
                </div>
                <div class="card">
                    <div class="card__header"><h2 class="card__title">Filter</h2></div>
                    <div class="form-grid">
                        ${datePickerHtml({ id: 'fromDate', label: 'From date' })}
                        ${datePickerHtml({ id: 'toDate', label: 'To date' })}
                    </div>
                    <div class="form-actions">
                        <cds-button id="apply-btn">Apply</cds-button>
                        <cds-button id="clear-btn" kind="secondary">Clear</cds-button>
                        <cds-button kind="tertiary" href="${urls.account(account.accountId, customerRef)}">Back to account</cds-button>
                    </div>
                </div>
                <div class="card">
                    <div class="card__header"><h2 class="card__title">History</h2></div>
                    <div id="transactions"></div>
                    <div class="pagination" id="pagination" style="display:none">
                        <span id="page-info" class="muted"></span>
                        <div class="chip-row">
                            <cds-button id="prev-btn" kind="secondary" size="md">Previous</cds-button>
                            <cds-button id="next-btn" kind="secondary" size="md">Next</cds-button>
                        </div>
                    </div>
                </div>`;

            document.getElementById('apply-btn').addEventListener('click', applyFilters);
            document.getElementById('clear-btn').addEventListener('click', () => {
                ['fromDate', 'toDate'].forEach((id) => {
                    const input = document.getElementById(id);
                    input.closest('cds-date-picker').value = '';
                    input.value = '';
                });
                applyFilters();
            });
            document.getElementById('prev-btn').addEventListener('click', () => { offset = Math.max(0, offset - PAGE_SIZE); loadTransactions(); });
            document.getElementById('next-btn').addEventListener('click', () => { offset += PAGE_SIZE; loadTransactions(); });

            loadTransactions();
        }

        function applyFilters() {
            clearNotification();
            const from = readDatePicker('fromDate');
            const to = readDatePicker('toDate');
            const iso = /^\d{4}-\d{2}-\d{2}$/;
            if ((from && !iso.test(from)) || (to && !iso.test(to))) {
                return notify('error', 'Validation error', 'Dates must be in the format dd/mm/yyyy');
            }
            if (from && to && from > to) {
                return notify('error', 'Validation error', 'The from date must be on or before the to date');
            }
            filters = { fromDate: from || undefined, toDate: to || undefined };
            offset = 0;
            loadTransactions();
        }

        async function loadTransactions() {
            const target = document.getElementById('transactions');
            target.innerHTML = '<cds-loading small></cds-loading>';
            try {
                const response = await api.accounts.getAccountTransactions(account.accountId, { ...filters, limit: PAGE_SIZE, offset });
                total = response.totalCount || 0;
                renderTransactions(response.transactions || []);
            } catch (error) {
                target.innerHTML = '';
                notify('error', 'Could not load transactions', errorMessage(error, 'Failed to load transactions'));
            }
        }

        function renderTransactions(transactions) {
            const target = document.getElementById('transactions');
            const pagination = document.getElementById('pagination');

            if (!transactions.length) {
                target.innerHTML = '<div class="empty">No transactions found for this account.</div>';
                pagination.style.display = 'none';
                return;
            }

            const rows = transactions.map((t) => {
                const credit = t.creditDebitIndicator === 'CREDIT';
                return `
                    <tr>
                        <td>${escapeHtml(formatDate(t.bookingDateTime))}</td>
                        <td>${escapeHtml(t.transactionInformation || 'N/A')}</td>
                        <td class="num ${credit ? 'credit' : 'debit'}">${credit ? '+' : '-'}${formatCurrency(Math.abs(t.amount || 0), t.currency)}</td>
                        <td>${escapeHtml(t.status || 'N/A')}</td>
                        <td><a href="${urls.transaction(account.accountId, t.transactionId, customerRef)}">Details</a></td>
                    </tr>`;
            }).join('');

            target.innerHTML = `<div class="table-wrap"><table class="bz-table">
                <thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead>
                <tbody>${rows}</tbody></table></div>`;

            if (total > PAGE_SIZE) {
                pagination.style.display = 'flex';
                document.getElementById('page-info').textContent =
                    `Showing ${offset + 1} to ${Math.min(offset + PAGE_SIZE, total)} of ${total}`;
                document.getElementById('prev-btn').toggleAttribute('disabled', offset === 0);
                document.getElementById('next-btn').toggleAttribute('disabled', offset + PAGE_SIZE >= total);
            } else {
                pagination.style.display = 'none';
            }
        }
    </script>
</body>
</html>
