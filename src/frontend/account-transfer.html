<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer funds - Bank of Z</title>
    <link rel="stylesheet" href="css/carbon-styles.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/carbon-overrides.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="page">
        <section class="page-banner"><div class="page-inner" id="banner"></div></section>

        <section class="page-content">
            <div class="page-inner">
                <div id="notification-container"></div>
                <div id="content"></div>
            </div>
        </section>
    </main>

    <script type="module" src="js/carbon.js"></script>
    <script type="module">
        import api, { imsNotImplementedError } from './js/api.js';
        import { mountPage, notify, clearNotification, errorMessage } from './js/components/layout.js';
        import {
            readContext, customerLookupHtml, bindCustomerLookup, fetchCustomerAccounts,
            loadAccountContext, setFieldError, urls, systemTagHtml
        } from './js/components/lookup.js';
        import { showLoadingModal, hideLoadingModal, formatCurrency, escapeHtml } from './js/utils.js';

        const content = document.getElementById('content');
        const { accountId, customer } = readContext();

        let account = null;
        let customerRef = null;
        let mode = 'number';          // 'number' or 'customer'
        let destinationId = null;     // chosen destination account number

        const crumbsHome = [{ label: 'Home', href: 'admin.html' }];

        if (customer && !customer.ok) {
            showLookup();
            notify('error', 'Invalid customer ID', customer.error);
        } else if (customer && customer.system === 'IMS') {
            showImsBlocked(customer);
        } else if (accountId) {
            loadSource();
        } else if (customer) {
            loadSourcePicker(customer);
        } else {
            showLookup();
        }

        /* ---------- IMS: no transfer route ---------- */
        function showImsBlocked(ref) {
            mountPage({
                crumbs: [...crumbsHome, { label: ref.ref, href: urls.customer(ref.ref) }, { label: 'Transfer funds' }],
                title: 'Transfer funds'
            });
            content.innerHTML = '';
            notify('warning', 'Not implemented for IMS', imsNotImplementedError('Transferring funds').message);
        }

        /* ---------- no customer: ask for one ---------- */
        function showLookup() {
            mountPage({ crumbs: [...crumbsHome, { label: 'Transfer funds' }], title: 'Transfer funds' });
            content.innerHTML = `
                <div class="card" style="max-width: 640px;">
                    <h2 class="card__title">Which customer is sending the money?</h2>
                    <p class="card__intro">Enter the customer ID, then choose the account to transfer from.</p>
                    ${customerLookupHtml({ buttonLabel: 'Continue' })}
                </div>`;
            bindCustomerLookup({ onFound: (r) => { window.location.href = urls.transfer(null, r.ref); } });
        }

        /* ---------- customer only: pick the source account ---------- */
        async function loadSourcePicker(ref) {
            mountPage({
                crumbs: [...crumbsHome, { label: ref.ref, href: urls.customer(ref.ref) }, { label: 'Transfer funds' }],
                title: 'Transfer funds',
                subtitle: `Choose the account to transfer from for customer ${ref.ref}`
            });
            content.innerHTML = '<cds-loading></cds-loading>';
            try {
                const accounts = await fetchCustomerAccounts(ref);
                if (!accounts.length) {
                    content.innerHTML = '<div class="card"><div class="empty">This customer has no accounts.</div></div>';
                    return;
                }
                const rows = accounts.map((a) => `
                    <tr>
                        <td>${escapeHtml(a.accountNumber || a.accountId)}</td>
                        <td>${escapeHtml(a.accountType || 'N/A')}</td>
                        <td class="num">${formatCurrency(a.availableBalance, a.currency)}</td>
                        <td><a href="${urls.transfer(a.accountId, ref.ref)}">Transfer from this account</a></td>
                    </tr>`).join('');
                content.innerHTML = `
                    <div class="card"><div class="table-wrap"><table class="bz-table">
                        <thead><tr><th>Account number</th><th>Type</th><th class="num">Available</th><th></th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table></div></div>`;
            } catch (error) {
                content.innerHTML = '';
                notify('error', 'Could not load accounts', errorMessage(error, 'Customer not found or error loading accounts'));
            }
        }

        /* ---------- source chosen: the form ---------- */
        async function loadSource() {
            mountPage({ crumbs: [...crumbsHome, { label: 'Transfer funds' }], title: 'Transfer funds' });
            content.innerHTML = '<cds-loading></cds-loading>';
            try {
                const ctx = await loadAccountContext(accountId, customer);
                account = ctx.account;
                customerRef = ctx.ref;
            } catch (error) {
                content.innerHTML = '';
                notify('error', 'Account not found', errorMessage(error, `Could not load account ${accountId}`));
                return;
            }

            const number = account.accountNumber || account.accountId;
            mountPage({
                crumbs: [
                    ...crumbsHome,
                    ...(customerRef ? [{ label: customerRef, href: urls.customer(customerRef) }] : []),
                    { label: `Account ${number}`, href: urls.account(account.accountId, customerRef) },
                    { label: 'Transfer funds' }
                ],
                title: 'Transfer funds',
                subtitle: `From account ${number}${customerRef ? ` for customer ${customerRef}` : ''}`
            });
            renderForm();
        }

        function renderForm() {
            const a = account;
            content.innerHTML = `
                <div class="stat-row">
                    <div class="stat"><div class="stat__label">From account</div><div class="stat__value">${escapeHtml(a.accountNumber || a.accountId)}</div></div>
                    <div class="stat"><div class="stat__label">Type</div><div class="stat__value">${escapeHtml(a.accountType || 'N/A')}</div></div>
                    <div class="stat"><div class="stat__label">Available balance</div><div class="stat__value" id="source-balance">${formatCurrency(a.availableBalance, a.currency)}</div></div>
                </div>

                <div class="card">
                    <div class="card__header"><h2 class="card__title">Send to</h2>${systemTagHtml('CICS')}</div>
                    <div class="destination-tabs">
                        <cds-button id="mode-number" size="sm">Account number</cds-button>
                        <cds-button id="mode-customer" size="sm" kind="tertiary">A customer's accounts</cds-button>
                    </div>
                    <div id="destination-panel"></div>
                </div>

                <div class="card">
                    <h2 class="card__title">Amount</h2>
                    <div class="form-grid">
                        <cds-text-input id="amount" label="Amount" placeholder="e.g. 50.00" helper-text="Must be greater than 0"></cds-text-input>
                    </div>
                    <div class="form-actions">
                        <cds-button id="submit-btn">Transfer funds</cds-button>
                        <cds-button kind="secondary" href="${urls.account(a.accountId, customerRef)}">Cancel</cds-button>
                    </div>
                </div>

                <div id="result"></div>`;

            document.getElementById('mode-number').addEventListener('click', () => setMode('number'));
            document.getElementById('mode-customer').addEventListener('click', () => setMode('customer'));
            document.getElementById('submit-btn').addEventListener('click', submit);
            document.getElementById('amount').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); submit(); }
            });
            setMode('number');
        }

        function setMode(next) {
            mode = next;
            destinationId = null;
            document.getElementById('mode-number').setAttribute('kind', mode === 'number' ? 'primary' : 'tertiary');
            document.getElementById('mode-customer').setAttribute('kind', mode === 'customer' ? 'primary' : 'tertiary');
            const panel = document.getElementById('destination-panel');

            if (mode === 'number') {
                panel.innerHTML = `
                    <div class="form-grid">
                        <cds-text-input id="toAccountId" label="Destination account number" placeholder="e.g. 10000002"
                            helper-text="The 8 digit account number. Press Enter to continue."></cds-text-input>
                    </div>`;
                const input = document.getElementById('toAccountId');
                input.addEventListener('input', () => { destinationId = null; setFieldError(input, ''); });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (acceptTypedAccount()) document.getElementById('amount').focus();
                    }
                });
            } else {
                panel.innerHTML = `
                    <p class="card__intro">Enter the customer who should receive the money, then pick one of their accounts.</p>
                    ${customerLookupHtml({ inputId: 'toCustomerId', buttonId: 'to-customer-btn', label: 'Destination customer ID', buttonLabel: 'Find accounts' })}
                    <div id="destination-accounts" style="margin-top: 1.25rem;"></div>`;
                bindCustomerLookup({
                    inputId: 'toCustomerId',
                    buttonId: 'to-customer-btn',
                    onFound: loadDestinationAccounts
                });
            }
        }

        /** Validates the typed account number; returns true when destinationId is set. */
        function acceptTypedAccount() {
            const input = document.getElementById('toAccountId');
            const value = (input.value || '').trim();
            if (!/^\d{8}$/.test(value)) {
                setFieldError(input, 'Account number must be 8 digits');
                destinationId = null;
                return false;
            }
            if (String(value) === String(account.accountId)) {
                setFieldError(input, 'Destination must be different from the source account');
                destinationId = null;
                return false;
            }
            setFieldError(input, '');
            destinationId = value;
            return true;
        }

        async function loadDestinationAccounts(ref) {
            const target = document.getElementById('destination-accounts');
            destinationId = null;
            if (ref.system === 'IMS') {
                target.innerHTML = '';
                notify('warning', 'Not implemented for IMS', imsNotImplementedError('Transferring funds').message);
                return;
            }
            clearNotification();
            target.innerHTML = '<cds-loading></cds-loading>';
            try {
                const accounts = (await fetchCustomerAccounts(ref))
                    .filter((a) => String(a.accountId) !== String(account.accountId));
                if (!accounts.length) {
                    target.innerHTML = `<div class="empty">Customer ${escapeHtml(ref.ref)} has no other accounts to send to.</div>`;
                    return;
                }
                const rows = accounts.map((a) => `
                    <tr>
                        <td>${escapeHtml(a.accountNumber || a.accountId)}</td>
                        <td>${escapeHtml(a.accountType || 'N/A')}</td>
                        <td class="num">${formatCurrency(a.availableBalance, a.currency)}</td>
                        <td><cds-button size="sm" kind="tertiary" class="pick-destination" data-id="${escapeHtml(a.accountId)}">Select</cds-button></td>
                    </tr>`).join('');
                target.innerHTML = `
                    <div class="table-wrap"><table class="bz-table">
                        <thead><tr><th>Account number</th><th>Type</th><th class="num">Available</th><th></th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table></div>
                    <p class="card__intro" id="destination-selected" style="margin-top: 1rem;">No account selected yet.</p>`;
                target.querySelectorAll('.pick-destination').forEach((button) => {
                    button.addEventListener('click', () => {
                        destinationId = button.dataset.id;
                        target.querySelectorAll('.pick-destination').forEach((b) => b.setAttribute('kind', 'tertiary'));
                        button.setAttribute('kind', 'primary');
                        document.getElementById('destination-selected').textContent = `Sending to account ${destinationId}.`;
                    });
                });
            } catch (error) {
                target.innerHTML = '';
                notify('error', 'Could not load accounts', errorMessage(error, 'Customer not found or error loading accounts'));
            }
        }

        async function submit() {
            clearNotification();
            if (mode === 'number') acceptTypedAccount();
            if (!destinationId) {
                return notify('error', 'Validation error',
                    mode === 'number' ? 'Enter a valid destination account number' : 'Find a customer and select a destination account');
            }
            const amount = parseFloat(document.getElementById('amount').value);
            if (!amount || amount <= 0) return notify('error', 'Validation error', 'Enter an amount greater than 0');

            showLoadingModal('Processing funds transfer...');
            try {
                const result = await api.accounts.transferFunds(account.accountId, { toAccountId: destinationId, amount }, 'CICS');
                hideLoadingModal();

                account.availableBalance = result.fromAccountAvailableBalance;
                document.getElementById('source-balance').textContent = formatCurrency(result.fromAccountAvailableBalance, account.currency);
                document.getElementById('amount').value = '';

                document.getElementById('result').innerHTML = `
                    <div class="card">
                        <h2 class="card__title">Transfer completed</h2>
                        <div class="transfer-result">
                            <div class="stat-row">
                                <div class="stat"><div class="stat__label">Source account</div><div class="stat__value">${escapeHtml(account.accountNumber || account.accountId)}</div></div>
                                <div class="stat"><div class="stat__label">Available balance</div><div class="stat__value">${formatCurrency(result.fromAccountAvailableBalance, account.currency)}</div></div>
                                <div class="stat"><div class="stat__label">Actual balance</div><div class="stat__value">${formatCurrency(result.fromAccountActualBalance, account.currency)}</div></div>
                            </div>
                            <div class="stat-row">
                                <div class="stat"><div class="stat__label">Destination account</div><div class="stat__value">${escapeHtml(destinationId)}</div></div>
                                <div class="stat"><div class="stat__label">Available balance</div><div class="stat__value">${formatCurrency(result.toAccountAvailableBalance, account.currency)}</div></div>
                                <div class="stat"><div class="stat__label">Actual balance</div><div class="stat__value">${formatCurrency(result.toAccountActualBalance, account.currency)}</div></div>
                            </div>
                        </div>
                    </div>`;
                notify('success', 'Transfer successful',
                    `${formatCurrency(amount, account.currency)} transferred from account ${account.accountNumber || account.accountId} to account ${destinationId}.`);
            } catch (error) {
                hideLoadingModal();
                notify('error', 'Transfer failed', errorMessage(error, 'The transfer could not be processed'));
            }
        }
    </script>
</body>
</html>
