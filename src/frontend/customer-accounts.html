<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Accounts for Customer - Bank of Z</title>

    <!-- Carbon Design System Styles -->
    <link rel="stylesheet" href="css/carbon-styles.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/carbon-overrides.css">
</head>

<body>
    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <cds-layer class="cds--white landing-page">
        <!-- Banner -->
        <cds-layer class="layer landing-page__banner">
            <div class="landing-page__heading">
                <cds-breadcrumb>
                    <cds-breadcrumb-item>
                        <cds-breadcrumb-link href="index.html">Home</cds-breadcrumb-link>
                    </cds-breadcrumb-item>
                    <cds-breadcrumb-item>
                        <cds-breadcrumb-link href="admin.html">Control Panel</cds-breadcrumb-link>
                    </cds-breadcrumb-item>
                    <cds-breadcrumb-item>
                        <cds-breadcrumb-link href="customer-accounts.html">Accounts for Customer</cds-breadcrumb-link>
                    </cds-breadcrumb-item>
                </cds-breadcrumb>
                <h1>Accounts for Customer</h1>
            </div>
        </cds-layer>

        <div class="cds--content">
            <!-- Error/Notification Container -->
            <div id="notification-container"></div>

            <cds-stack gap="7">
                <!-- Search Section -->
                <cds-grid>
                    <cds-column lg="8" md="6" sm="4">
                        <cds-stack gap="5">
                            <cds-form-item>
                                <cds-text-input
                                    id="customerId"
                                    label="Customer ID"
                                    placeholder="C1234 or I000000015"
                                    helper-text="Enter Customer ID with prefix: C for CICS, I for IMS">
                                </cds-text-input>
                            </cds-form-item>
                            <cds-button id="search-btn">Search Accounts</cds-button>
                        </cds-stack>
                    </cds-column>
                </cds-grid>

                <!-- Results Section -->
                <cds-layer class="layer" id="results-section" style="display: none;">
                    <h3 id="results-heading"></h3>
                    <div id="accounts-table"></div>
                </cds-layer>
            </cds-stack>
        </div>
    </cds-layer>

    <!-- Carbon Web Components -->
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/ui-shell.min.js"></script>
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/breadcrumb.min.js"></script>
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/form.min.js"></script>
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/text-input.min.js"></script>
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/button.min.js"></script>
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/stack.min.js"></script>
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/grid.min.js"></script>
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/layer.min.js"></script>
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/loading.min.js"></script>
    <script type="module"
        src="https://1.www.s81c.com/common/carbon/web-components/version/v2.47.0/notification.min.js"></script>

    <!-- Page Script -->
    <script type="module">
        import { createAdminHeader } from './js/components/headers.js';
        import api from './js/api.js';
        import { showLoadingModal, hideLoadingModal, formatCurrency, validateCustomerId, parseCustomerId } from './js/utils.js';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('header-container').innerHTML = createAdminHeader();

            document.getElementById('search-btn').addEventListener('click', searchAccounts);
            document.getElementById('customerId').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    searchAccounts();
                }
            });

            // Pre-fill from query string: ?customerId=C1234
            const params = new URLSearchParams(window.location.search);
            const qId = params.get('customerId');
            if (qId) {
                document.getElementById('customerId').value = qId;
                searchAccounts();
            }
        });

        function displayNotification(kind, title, message) {
            const container = document.getElementById('notification-container');
            container.innerHTML = `
                <cds-inline-notification kind="${kind}" title="${title}" subtitle="${message}" hide-close-button></cds-inline-notification>
                <br />
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearNotification() {
            document.getElementById('notification-container').innerHTML = '';
        }

        async function searchAccounts() {
            const customerIdInput = document.getElementById('customerId').value.trim();

            clearNotification();

            if (!customerIdInput) {
                displayNotification('error', 'Validation Error', 'Please enter a Customer ID');
                return;
            }

            const validation = validateCustomerId(customerIdInput);
            if (!validation.valid) {
                displayNotification('error', 'Validation Error', validation.error);
                return;
            }

            const parsed = parseCustomerId(customerIdInput);
            const customerId = parsed.customerId;
            const system = parsed.system;

            showLoadingModal('Loading accounts...');

            try {
                const response = await api.customers.getCustomerAccounts(customerId, system);
                const accounts = response.accounts || [];

                hideLoadingModal();
                document.getElementById('results-section').style.display = 'block';

                if (accounts.length === 0) {
                    document.getElementById('results-heading').textContent = `No accounts found for customer ${customerIdInput}`;
                    document.getElementById('accounts-table').innerHTML = '';
                } else {
                    document.getElementById('results-heading').textContent =
                        `${accounts.length} account${accounts.length === 1 ? '' : 's'} for customer ${customerIdInput}`;
                    displayAccountsTable(accounts);
                }
            } catch (error) {
                hideLoadingModal();
                displayNotification('error', 'Error', 'Customer not found or error loading accounts');
                document.getElementById('results-section').style.display = 'none';
            }
        }

        function displayAccountsTable(accounts) {
            const rows = accounts.map(acc => {
                const accountId   = acc.accountId   || '';
                const sortCode    = acc.sortCode     || 'N/A';
                const accNumber   = acc.accountNumber || accountId || 'N/A';
                const accType     = acc.accountType  || 'N/A';
                const available   = (typeof acc.availableBalance === 'number')
                    ? formatCurrency(acc.availableBalance) : 'N/A';
                const actual      = (typeof acc.actualBalance === 'number')
                    ? formatCurrency(acc.actualBalance) : 'N/A';
                const detailsHref = `account-details.html?accountId=${encodeURIComponent(accountId)}`;

                return `
                    <tr>
                        <td>${sortCode}</td>
                        <td><a href="${detailsHref}" style="color: var(--cds-link-primary)">${accNumber}</a></td>
                        <td>${accType}</td>
                        <td style="text-align:right">${available}</td>
                        <td style="text-align:right">${actual}</td>
                    </tr>`;
            }).join('');

            document.getElementById('accounts-table').innerHTML = `
                <table class="cds--data-table cds--data-table--zebra cds--data-table--short">
                    <thead>
                        <tr>
                            <th>Sort Code</th>
                            <th>Account Number</th>
                            <th>Account Type</th>
                            <th style="text-align:right">Available Balance</th>
                            <th style="text-align:right">Actual Balance</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>`;
        }
    </script>
</body>

</html>
