<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create customer - Bank of Z</title>
    <link rel="stylesheet" href="css/carbon-styles.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/carbon-overrides.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="page">
        <section class="page-banner"><div class="page-inner" id="banner"></div></section>

        <section class="page-content">
            <div class="page-inner">
                <div id="notification-container"></div>

                <div class="card">
                    <h2 class="card__title">Personal details</h2>
                    <div class="form-grid">
                        <cds-select id="title" label-text="Title" value="Mr">
                            <cds-select-item value="Mr">Mr</cds-select-item>
                            <cds-select-item value="Mrs">Mrs</cds-select-item>
                            <cds-select-item value="Miss">Miss</cds-select-item>
                            <cds-select-item value="Ms">Ms</cds-select-item>
                            <cds-select-item value="Dr">Dr</cds-select-item>
                            <cds-select-item value="Drs">Drs</cds-select-item>
                            <cds-select-item value="Professor">Professor</cds-select-item>
                            <cds-select-item value="Sir">Sir</cds-select-item>
                            <cds-select-item value="Lady">Lady</cds-select-item>
                            <cds-select-item value="Lord">Lord</cds-select-item>
                        </cds-select>
                        <cds-text-input id="firstName" label="First name" maxlength="50"></cds-text-input>
                        <cds-text-input id="lastName" label="Last name" maxlength="50"></cds-text-input>
                        <cds-date-picker date-format="d/m/Y">
                            <cds-date-picker-input id="dateOfBirth" kind="single" label-text="Date of birth" placeholder="dd/mm/yyyy"></cds-date-picker-input>
                        </cds-date-picker>
                        <cds-text-input id="phoneNumber" label="Phone number" maxlength="20"></cds-text-input>
                    </div>
                </div>

                <div class="card">
                    <h2 class="card__title">Address</h2>
                    <div class="form-grid">
                        <cds-text-input id="addressLine1" label="Address line 1" maxlength="50"></cds-text-input>
                        <cds-text-input id="addressLine2" label="Address line 2 (optional)" maxlength="50"></cds-text-input>
                        <cds-text-input id="city" label="City" maxlength="50"></cds-text-input>
                        <cds-text-input id="postalCode" label="Postcode" maxlength="10"></cds-text-input>
                        <cds-text-input id="country" label="Country" maxlength="50"></cds-text-input>
                    </div>
                    <div class="form-actions">
                        <cds-button id="submit-btn">Create customer</cds-button>
                        <cds-button kind="secondary" href="admin.html">Cancel</cds-button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="js/carbon.js"></script>
    <script type="module">
        import api from './js/api.js';
        import { mountPage, notify, clearNotification, errorMessage } from './js/components/layout.js';
        import { urls } from './js/components/lookup.js';
        import { showLoadingModal, hideLoadingModal, parseDate, formatCustomerId } from './js/utils.js';

        mountPage({
            crumbs: [{ label: 'Home', href: 'admin.html' }, { label: 'Create customer' }],
            title: 'Create customer',
            subtitle: 'New customers are created in CICS. Creating IMS customers is not implemented yet.'
        });

        document.getElementById('submit-btn').addEventListener('click', createCustomer);

        const value = (id) => (document.getElementById(id).value || '').trim();

        // Mirrors the OpenAPI constraints in src/api/src/main/api/openapi.yaml#CreateCustomerRequest.
        // The backend (CRECUST COBOL) silently truncates over-length names instead of
        // rejecting them, so this is the only place that actually stops it.
        function validateCustomerData({ firstName, lastName, phoneNumber, dateOfBirth, addressLine1, addressLine2, city, postalCode, country }) {
            const requiredFields = {
                'First name': firstName,
                'Last name': lastName,
                'Phone number': phoneNumber,
                'Date of birth': dateOfBirth,
                'Address line 1': addressLine1,
                'City': city,
                'Postcode': postalCode,
                'Country': country
            };
            const missing = Object.entries(requiredFields)
                .filter(([, v]) => !v)
                .map(([label]) => label);
            if (missing.length > 0) {
                return `Please fill in: ${missing.join(', ')}`;
            }
            const maxLengths = {
                'First name': [firstName, 50],
                'Last name': [lastName, 50],
                'Phone number': [phoneNumber, 15],
                'Address line 1': [addressLine1, 100],
                'Address line 2': [addressLine2, 100],
                'City': [city, 50],
                'Postcode': [postalCode, 10],
                'Country': [country, 50]
            };
            for (const [label, [v, max]] of Object.entries(maxLengths)) {
                if (v && v.length > max) {
                    return `${label} must be ${max} characters or fewer (currently ${v.length})`;
                }
            }
            if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dateOfBirth) || Number.isNaN(Date.parse(parseDate(dateOfBirth)))) {
                return 'Date of birth must be a valid date in the form dd/mm/yyyy';
            }
            return null;
        }

        async function createCustomer() {
            clearNotification();
            const data = {
                title: value('title'),
                firstName: value('firstName'),
                lastName: value('lastName'),
                phoneNumber: value('phoneNumber'),
                dateOfBirth: value('dateOfBirth'),
                addressLine1: value('addressLine1'),
                addressLine2: value('addressLine2'),
                city: value('city'),
                postalCode: value('postalCode'),
                country: value('country')
            };

            const validationError = validateCustomerData(data);
            if (validationError) return notify('error', 'Validation error', validationError);

            const customerData = {
                title: data.title || undefined,
                firstName: data.firstName,
                lastName: data.lastName,
                dateOfBirth: parseDate(data.dateOfBirth),
                phoneNumber: data.phoneNumber,
                address: {
                    addressLine1: data.addressLine1,
                    addressLine2: data.addressLine2 || undefined,
                    city: data.city,
                    postalCode: data.postalCode,
                    country: data.country
                },
                customerStatus: 'ACTIVE'
            };

            showLoadingModal('Creating customer...');
            try {
                const response = await api.customers.createCustomer(customerData, 'CICS');
                hideLoadingModal();
                window.location.href = urls.customer(formatCustomerId(response.customerId, 'CICS'));
            } catch (error) {
                hideLoadingModal();
                notify('error', 'Could not create customer', errorMessage(error, 'Failed to create customer. Please try again.'));
            }
        }
    </script>
</body>
</html>
