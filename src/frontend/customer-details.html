<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer - Bank of Z</title>
    <link rel="stylesheet" href="css/carbon-styles.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/carbon-overrides.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="page">
        <section class="page-banner"><div class="page-inner" id="banner"></div></section>

        <section class="page-content">
            <div class="page-inner">
                <div id="notification-container"></div>
                <div id="content"></div>
            </div>
        </section>
    </main>

    <script type="module" src="js/carbon.js"></script>
    <script type="module">
        import api from './js/api.js';
        import { mountPage, setBanner, notify, clearNotification, errorMessage } from './js/components/layout.js';
        import {
            readContext, customerLookupHtml, bindCustomerLookup, fetchCustomerAccounts,
            customerName, systemTagHtml, urls, IMS_LIMITED_NOTE, datePickerHtml, readDatePicker
        } from './js/components/lookup.js';
        import { showLoadingModal, hideLoadingModal, showConfirmModal, formatCurrency, formatDate, escapeHtml } from './js/utils.js';

        const TITLES = ['', 'Mr', 'Mrs', 'Miss', 'Ms', 'Dr', 'Drs', 'Professor', 'Sir', 'Lady', 'Lord'];
        const content = document.getElementById('content');

        let ref = null;        // parsed customer reference {id, system, ref}
        let customer = null;   // customer from the API
        let accounts = [];

        const { customer: fromUrl } = readContext();

        if (!fromUrl) {
            showLookup();
        } else if (!fromUrl.ok) {
            showLookup();
            notify('error', 'Invalid customer ID', fromUrl.error);
        } else {
            ref = fromUrl;
            load();
        }

        /* ---------- no customer chosen yet ---------- */
        function showLookup() {
            mountPage({ crumbs: [{ label: 'Home', href: 'admin.html' }, { label: 'Find customer' }], title: 'Find a customer' });
            content.innerHTML = `
                <div class="card" style="max-width: 640px;">
                    <h2 class="card__title">Customer ID</h2>
                    <p class="card__intro">Enter the customer ID, starting with C for CICS or I for IMS.</p>
                    ${customerLookupHtml()}
                </div>`;
            bindCustomerLookup({ onFound: (r) => { window.location.href = urls.customer(r.ref); } });
        }

        /* ---------- load customer + accounts ---------- */
        async function load() {
            mountPage({
                crumbs: [{ label: 'Home', href: 'admin.html' }, { label: ref.ref }],
                title: `Customer ${ref.ref}`
            });
            content.innerHTML = '<cds-loading></cds-loading>';

            try {
                [customer, accounts] = await Promise.all([
                    api.customers.getCustomer(ref.id, ref.system),
                    fetchCustomerAccounts(ref).catch(() => [])
                ]);
            } catch (error) {
                content.innerHTML = '';
                notify('error', 'Customer not found', errorMessage(error, `Could not load customer ${ref.ref}`));
                content.innerHTML = `<div class="card"><p><a href="admin.html">Back to home</a> to look up another customer.</p></div>`;
                return;
            }
            render();
            const deleted = new URLSearchParams(window.location.search).get('deletedAccount');
            if (deleted) notify('success', 'Account closed', `Account ${deleted} has been deleted.`);
        }

        function renderBanner() {
            const isIms = ref.system === 'IMS';
            const actions = isIms ? '' : `
                <cds-button href="${urls.createAccount(ref.ref)}">Open new account</cds-button>
                <cds-button id="delete-customer-btn" kind="danger-tertiary">Delete customer</cds-button>`;
            setBanner({
                crumbs: [{ label: 'Home', href: 'admin.html' }, { label: ref.ref }],
                title: customerName(customer) || `Customer ${ref.ref}`,
                subtitle: `Customer ${ref.ref}`,
                actionsHtml: actions
            });
            document.getElementById('delete-customer-btn')?.addEventListener('click', deleteCustomer);
        }

        function render() {
            renderBanner();
            clearNotification();
            const isIms = ref.system === 'IMS';

            content.innerHTML = `
                ${isIms ? `<cds-inline-notification kind="info" title="IMS customer" subtitle="${escapeHtml(IMS_LIMITED_NOTE)}" hide-close-button style="max-width:none;width:100%"></cds-inline-notification>` : ''}
                <div class="card">
                    <div class="card__header">
                        <h2 class="card__title">Accounts</h2>
                    </div>
                    ${accountsTable()}
                </div>
                <div class="card">
                    <div class="card__header"><h2 class="card__title">Customer details</h2>${systemTagHtml(ref.system)}</div>
                    ${detailsForm()}
                </div>`;

            const titleSelect = document.getElementById('f-title');
            if (titleSelect) titleSelect.value = customer.title || '';
            document.getElementById('save-btn').addEventListener('click', saveCustomer);
            document.getElementById('reset-btn').addEventListener('click', render);
        }

        /* ---------- accounts ---------- */
        function accountsTable() {
            if (!accounts.length) {
                return `<div class="empty">This customer has no accounts yet.${ref.system === 'IMS' ? '' : ` <a href="${urls.createAccount(ref.ref)}">Open one</a>.`}</div>`;
            }
            const isIms = ref.system === 'IMS';
            const rows = accounts.map((a) => {
                const id = a.accountId;
                const links = [`<a href="${urls.account(id, ref.ref)}">Details</a>`];
                if (!isIms) links.push(`<a href="${urls.transactions(id, ref.ref)}">Transactions</a>`);
                links.push(`<a href="${urls.deposit(id, ref.ref)}">Credit / debit</a>`);
                if (!isIms) links.push(`<a href="${urls.transfer(id, ref.ref)}">Transfer</a>`);
                return `
                    <tr>
                        <td><a href="${urls.account(id, ref.ref)}">${escapeHtml(a.accountNumber || id)}</a></td>
                        <td>${escapeHtml(a.accountType || 'N/A')}</td>
                        <td>${escapeHtml(a.status || 'N/A')}</td>
                        <td class="num">${formatCurrency(a.availableBalance, a.currency)}</td>
                        <td class="num">${formatCurrency(a.actualBalance, a.currency)}</td>
                        <td><div class="row-actions">${links.join('')}</div></td>
                    </tr>`;
            }).join('');
            return `
                <div class="table-wrap"><table class="bz-table">
                    <thead><tr>
                        <th>Account number</th><th>Type</th><th>Status</th>
                        <th class="num">Available</th><th class="num">Actual</th><th>Actions</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table></div>`;
        }

        /* ---------- details form ---------- */
        function field(id, label, value, extra = '') {
            return `<cds-text-input id="f-${id}" label="${label}" value="${escapeHtml(value || '')}" ${extra}></cds-text-input>`;
        }

        function detailsForm() {
            const a = customer.address || {};
            const dob = formatDate((customer.dateOfBirth || '').split('-').map((p, i) => (i === 0 ? p.padStart(4, '0') : p.padStart(2, '0'))).join('-'));
            return `
                <div class="form-grid">
                    <cds-select id="f-title" label-text="Title">
                        ${TITLES.map((t) => `<cds-select-item value="${t}">${t || 'None'}</cds-select-item>`).join('')}
                    </cds-select>
                    ${field('firstName', 'First name', customer.firstName, 'maxlength="50"')}
                    ${field('lastName', 'Last name', customer.lastName, 'maxlength="50"')}
                    ${field('phoneNumber', 'Phone number', customer.phoneNumber, 'maxlength="20"')}
                    ${datePickerHtml({ id: 'f-dateOfBirth', label: 'Date of birth', value: dob })}
                    <div></div>
                    ${field('addressLine1', 'Address line 1', a.addressLine1, 'maxlength="50"')}
                    ${field('addressLine2', 'Address line 2', a.addressLine2, 'maxlength="50"')}
                    ${field('city', 'City', a.city, 'maxlength="50"')}
                    ${field('postalCode', 'Postcode', a.postalCode, 'maxlength="10"')}
                    ${field('country', 'Country', a.country, 'maxlength="50"')}
                </div>
                <dl class="kv" style="margin-top: 1.5rem;">
                    <div><dt>Customer ID</dt><dd>${escapeHtml(ref.ref)}</dd></div>
                    <div><dt>Status</dt><dd>${escapeHtml(customer.customerStatus || 'N/A')}</dd></div>
                    ${customer.createdDate ? `<div><dt>Created</dt><dd>${escapeHtml(customer.createdDate)}</dd></div>` : ''}
                </dl>
                <div class="form-actions">
                    <cds-button id="save-btn">Save changes</cds-button>
                    <cds-button id="reset-btn" kind="secondary">Discard changes</cds-button>
                </div>`;
        }

        const val = (id) => (document.getElementById(`f-${id}`).value || '').trim();

        async function saveCustomer() {
            clearNotification();
            const title = val('title'), firstName = val('firstName'), lastName = val('lastName');
            const phoneNumber = val('phoneNumber'), dateOfBirth = readDatePicker('f-dateOfBirth');
            const addressLine1 = val('addressLine1'), addressLine2 = val('addressLine2');
            const city = val('city'), postalCode = val('postalCode'), country = val('country');

            if (!firstName && !lastName && !addressLine1) {
                return notify('error', 'Validation error', 'At least one of first name, last name or address line 1 is required');
            }
            if (dateOfBirth && !/^\d{4}-\d{2}-\d{2}$/.test(dateOfBirth)) {
                return notify('error', 'Validation error', 'Date of birth must be in the format dd/mm/yyyy');
            }

            const update = {};
            if (title) update.title = title;
            if (firstName) update.firstName = firstName;
            if (lastName) update.lastName = lastName;
            if (phoneNumber) update.phoneNumber = phoneNumber;
            if (dateOfBirth) update.dateOfBirth = dateOfBirth;
            const address = { addressLine1, addressLine2, city, postalCode, country };
            const filled = Object.fromEntries(Object.entries(address).filter(([, v]) => v));
            if (Object.keys(filled).length) update.address = filled;

            showLoadingModal('Saving customer...');
            try {
                const updated = await api.customers.updateCustomer(ref.id, update, ref.system);
                hideLoadingModal();
                customer = { ...customer, ...updated };
                render();
                notify('success', 'Saved', 'Customer details updated');
            } catch (error) {
                hideLoadingModal();
                notify('error', 'Could not save customer', errorMessage(error, 'Failed to update customer'));
            }
        }

        /* ---------- delete ---------- */
        async function deleteCustomer() {
            const count = accounts.length;
            const detail = count
                ? `They currently have ${count} account${count === 1 ? '' : 's'}. This cannot be undone.`
                : 'This cannot be undone.';
            const confirmed = await showConfirmModal(
                `Delete customer ${ref.ref}?`,
                `${customerName(customer) || ref.ref} will be permanently removed. ${detail}`,
                { confirmLabel: 'Delete customer', danger: true }
            );
            if (!confirmed) return;

            showLoadingModal('Deleting customer...');
            try {
                await api.customers.deleteCustomer(ref.id, ref.system);
                hideLoadingModal();
                window.location.href = `admin.html?deletedCustomer=${encodeURIComponent(ref.ref)}`;
            } catch (error) {
                hideLoadingModal();
                notify('error', 'Could not delete customer', errorMessage(error, 'Failed to delete customer'));
            }
        }
    </script>
</body>
</html>
