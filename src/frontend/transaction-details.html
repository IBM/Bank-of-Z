<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction - Bank of Z</title>
    <link rel="stylesheet" href="css/carbon-styles.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/carbon-overrides.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="page">
        <section class="page-banner"><div class="page-inner" id="banner"></div></section>

        <section class="page-content">
            <div class="page-inner">
                <div id="notification-container"></div>
                <div id="content"></div>
            </div>
        </section>
    </main>

    <script type="module" src="js/carbon.js"></script>
    <script type="module">
        import api from './js/api.js';
        import { mountPage, notify, errorMessage } from './js/components/layout.js';
        import { readContext, urls } from './js/components/lookup.js';
        import { formatCurrency, formatDate, escapeHtml } from './js/utils.js';

        const content = document.getElementById('content');
        const { accountId, customer, params } = readContext();
        const transactionId = params.get('transactionId');
        const ref = customer && customer.ok ? customer.ref : null;

        const crumbs = [
            { label: 'Home', href: 'admin.html' },
            ...(ref ? [{ label: ref, href: urls.customer(ref) }] : []),
            ...(accountId ? [{ label: `Account ${accountId}`, href: urls.account(accountId, ref) },
                             { label: 'Transactions', href: urls.transactions(accountId, ref) }] : []),
            { label: 'Transaction' }
        ];
        mountPage({ crumbs, title: 'Transaction details', subtitle: transactionId ? `Transaction ${transactionId}` : '' });

        if (!accountId || !transactionId) {
            notify('error', 'Missing details', 'An account and a transaction are needed to show this page.');
        } else {
            load();
        }

        async function load() {
            content.innerHTML = '<cds-loading></cds-loading>';
            try {
                render(await api.accounts.getTransaction(accountId, transactionId));
            } catch (error) {
                content.innerHTML = '';
                notify('error', 'Could not load transaction', errorMessage(error, 'Failed to load transaction details'));
            }
        }

        function row(label, value) {
            return `<div><dt>${label}</dt><dd>${value}</dd></div>`;
        }

        function render(t) {
            const credit = t.creditDebitIndicator === 'CREDIT';
            const merchant = t.merchantDetails
                ? `<div class="card"><div class="card__header"><h2 class="card__title">Merchant</h2></div><dl class="kv">
                    ${row('Name', escapeHtml(t.merchantDetails.merchantName || 'N/A'))}
                    ${row('Category code', escapeHtml(t.merchantDetails.merchantCategoryCode || 'N/A'))}
                   </dl></div>` : '';
            const balance = t.balance
                ? `<div class="card"><div class="card__header"><h2 class="card__title">Balance after transaction</h2></div><dl class="kv">
                    ${row('Type', escapeHtml(t.balance.balanceType || 'N/A'))}
                    ${row('Amount', formatCurrency(t.balance.amount, t.balance.currency))}
                   </dl></div>` : '';

            content.innerHTML = `
                <div class="stat-row">
                    <div class="stat"><div class="stat__label">Amount</div>
                        <div class="stat__value ${credit ? 'credit' : 'debit'}">${credit ? '+' : '-'}${formatCurrency(Math.abs(t.amount || 0), t.currency)}</div></div>
                    <div class="stat"><div class="stat__label">Type</div><div class="stat__value">${credit ? 'Credit' : 'Debit'}</div></div>
                    <div class="stat"><div class="stat__label">Status</div><div class="stat__value">${escapeHtml(t.status || 'N/A')}</div></div>
                </div>
                <div class="card">
                    <div class="card__header"><h2 class="card__title">Details</h2></div>
                    <dl class="kv">
                        ${row('Transaction ID', escapeHtml(t.transactionId))}
                        ${row('Account', escapeHtml(t.accountId || accountId))}
                        ${row('Booked', escapeHtml(formatDate(t.bookingDateTime)))}
                        ${t.valueDateTime ? row('Value date', escapeHtml(formatDate(t.valueDateTime))) : ''}
                        ${row('Description', escapeHtml(t.transactionInformation || 'N/A'))}
                    </dl>
                </div>
                ${merchant}${balance}
                <div><cds-button kind="secondary" href="${urls.transactions(accountId, ref)}">Back to transactions</cds-button></div>`;
        }
    </script>
</body>
</html>
