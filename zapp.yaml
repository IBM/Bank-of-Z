name: Bank of Z zapp document
description: >-
  See the user documentation for more details:
  https://ibm.github.io/zopeneditor-about/Docs/setting_propertygroup.html
author: Bank of Z Team
propertyGroups:
  - name: search-all
    libraries:
      - name: syslib
        type: local
        locations:
          - "src/base/cics/copy"
          - "src/base/ims/copy"
      - name: syslib
        type: mvs
        locations:
          - ${DTE_COPYBOOK_DATASET}

profiles:
  # TAZ
  - name: taz-test
    type: test
    settings:
      unitTest:
        procLib:
          - SYS1.PROCLIB # Required: Procedure libraries
        userLibraries:
          - ${USERHLQ}.BOZ.BLD.LOAD # Application load libraries
          
  # Custom ZCodeScan rules example
  - name: zcodescan
    type: zcodescan
    settings:
      rules:
        - type: local
          locations:
            - "zcodescan/zcodescan-rules.yaml"